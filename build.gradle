plugins {
    id 'base'
    id 'fabric-loom' version '1.6-SNAPSHOT' apply false
}

allprojects {
    group = 'dev.kizuna.meridian.ui'
    version = '0.1.0-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'

    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.wispforest.io/releases' }
        mavenCentral()
    }
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
    base.archivesName = "${rootProject.name}-${project.name}"
    tasks.withType(JavaCompile).configureEach {
        options.release = 17
        options.encoding = 'UTF-8'
    }
    tasks.withType(JavaExec).configureEach {
        // 游戏演示与正式目标统一使用 Java 17，避免开发机默认版本掩盖兼容问题。
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }
    tasks.withType(Jar).configureEach {
        // 附属只分发自身内容；对应框架和 Protobuf 运行库由宿主提供。
        from(rootProject.files('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md'))
    }
}

tasks.named('assemble') {
    dependsOn ':client:assemble', ':server:assemble'
}
tasks.named('check') {
    dependsOn ':client:check', ':server:check'
}
tasks.named('clean') {
    dependsOn ':client:clean', ':server:clean'
}

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
}

rootProject.name = 'kizuna-meridian-ui-addon'
include 'client', 'server'

// 框架尚未发布 Maven 产物，直接组合独立仓库构建以复用其唯一协议源。
def frameworkDirectory = providers.gradleProperty('meridianFrameworkDir')
        .getOrElse('../Kizuna-Meridian-Mod-Framework')
includeBuild(frameworkDirectory) {
    dependencySubstitution {
        substitute module('local.meridian:client') using project(':client')
        substitute module('local.meridian:server') using project(':server')
    }
}

// 窗口与公共路由使用各自的框架项目，避免服务端依赖客户端渲染代码。
def inventoryUiDirectory = providers.gradleProperty('inventoryUiFrameworkDir')
        .getOrElse('../Kizuna-Inventory-UI-Framework')
includeBuild(inventoryUiDirectory) {
    dependencySubstitution {
        substitute module('local.inventory-ui:client') using project(':')
        substitute module('local.inventory-ui:server') using project(':server')
    }
}

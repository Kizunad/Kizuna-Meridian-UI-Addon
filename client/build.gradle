loom {
    mods {
        meridian_ui_codex_test { sourceSet sourceSets.codexTest }
    }
    runs {
        codexTest {
            client()
            source sourceSets.codexTest
            runDir 'build/codex-test'
            programArgs '--quickPlaySingleplayer', 'codex-test', '--width', '1280', '--height', '960'
        }
    }
}
tasks.register('prepareCodexWorld', Copy) {
    from new File(kizunaWorkspace.directory('progression'), 'fabric/build/gametest/world')
    into layout.buildDirectory.dir('codex-test/saves/codex-test')
    exclude 'session.lock'
}
tasks.named('runCodexTest') {
    dependsOn tasks.named('prepareCodexWorld')
    def report = layout.buildDirectory.file('codex-results.txt')
    doFirst {
        report.get().asFile.text = 'success=false\n'
        def options = layout.buildDirectory.file('codex-test/options.txt').get().asFile
        options.parentFile.mkdirs()
        options.text = 'onboardAccessibility:false\nlang:zh_cn\nguiScale:2\ntutorialStep:none\n'
    }
    doLast {
        if (!report.get().asFile.text.startsWith('success=true')) {
            throw new GradleException("功法谱客户端截图失败：${report.get().asFile}")
        }
    }
}


// 吐纳窗口在真实完整装配客户端里连拍，测试入口不进入发行 JAR。两个场景共用一个源码集，
// 运行任务用系统属性点名：element 到下界自动吐纳 5 分钟看攒五行真元；
// reject 先把经脉灌满看纳不进时写不写原因，再清空看那行消失。
def breathScenes = [element: '吐纳攒五行真元', reject: '吐纳纳不进时写原因']
sourceSets {
    breathTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        meridian_ui_breath_test { sourceSet sourceSets.breathTest }
    }
    runs {
        breathScenes.each { scene, title ->
            create("breath${scene.capitalize()}Test") {
                client()
                source sourceSets.breathTest
                runDir "build/breath-${scene}-test"
                property 'meridian.breathScene', scene
                programArgs '--quickPlaySingleplayer', "breath-${scene}-test",
                        '--width', '1280', '--height', '960'
            }
        }
    }
}
breathScenes.each { scene, title ->
    def runName = "breath-${scene}-test"
    // 每次都把存档换成干净的模板（Sync 会删掉上一次留下的文件）：只覆盖不删的话，
    // 世界时钟回到模板的零点，上一次存下的身体和环境窗口却还在、落在「未来」，
    // 吐纳的每一口都会被拒，纳入一直是 0。
    def prepare = tasks.register("prepareBreath${scene.capitalize()}World", Sync) {
        from new File(kizunaWorkspace.directory('progression'), 'fabric/build/gametest/world')
        into layout.buildDirectory.dir("${runName}/saves/${runName}")
        exclude 'session.lock'
    }
    tasks.named("runBreath${scene.capitalize()}Test") {
        dependsOn prepare
        def report = layout.buildDirectory.file("breath-${scene}-results.txt")
        def shots = layout.buildDirectory.dir("${runName}/screenshots")
        doFirst {
            report.get().asFile.text = 'success=false\n'
            // 上一次的截图不留，免得张数对不上。
            shots.get().asFile.deleteDir()
            def options = layout.buildDirectory.file("${runName}/options.txt").get().asFile
            options.parentFile.mkdirs()
            options.text = 'onboardAccessibility:false\nlang:zh_cn\nguiScale:2\n'
            // 首次吐纳的操作指引会挡住开始按钮，这里当作已经看过。
            def tutorial = layout.buildDirectory
                    .file("${runName}/config/meridian-breathing-tutorial.txt").get().asFile
            tutorial.parentFile.mkdirs()
            tutorial.text = '手动吐纳操作指引已读\n'
        }
        doLast {
            if (!report.get().asFile.text.startsWith('success=true')) {
                throw new GradleException("${title}客户端验收失败：${report.get().asFile}")
            }
        }
    }
}

plugins {
    id 'fabric-loom'
}

description = '通用身体模型、分层选择与状态展示。'

def inventoryDirectory = rootProject.file(providers.gradleProperty('inventoryUiFrameworkDir')
        .getOrElse('../Kizuna-Inventory-UI-Framework'))
def inventoryJar = new File(inventoryDirectory, 'build/libs/kizuna-inventory-ui-framework-0.1.0-SNAPSHOT.jar')
def animationDirectory = rootProject.file('../Kizuna-Players-Animation')
def animationJar = new File(animationDirectory, 'build/libs/kizuna-players-animation-0.1.0-SNAPSHOT.jar')
if (!inventoryJar.isFile()) {
    throw new GradleException('请先在 Inventory UI Framework 仓库运行 ./gradlew build，生成可重映射的客户端 JAR。')
}

dependencies {
    // 经脉消息与窗口 API 都是必需编译依赖，运行时由宿主提供对应框架。
    implementation 'local.meridian:client'
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings 'net.fabricmc:yarn:1.20.1+build.10:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.10'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.3+1.20.1'
    modImplementation 'io.wispforest:owo-lib:0.11.2+1.20'
    // Loom 将已构建框架映射到开发命名；不把框架内嵌进 UI 附属。
    modImplementation files(inventoryJar)
    // 预览直接使用必装动画模组的公开 API。
    modImplementation files(animationJar)
    modImplementation files('../../Kizuna-Meridian-Progression-Addon/client/build/libs/kizuna-meridian-progression-addon-client-0.1.0-SNAPSHOT.jar')
    implementation files('../../Kizuna-Meridian-Progression-Addon/shared/build/libs/kizuna-meridian-progression-addon-shared-0.1.0-SNAPSHOT.jar')
    testImplementation 'junit:junit:4.13.2'
    // Loom 开发运行不展开宿主 JAR 的嵌套资源模组，显式装配必需人体展示包。
    localRuntime files('../../Kizuna-Meridian-Human-Addon/client/build/libs/kizuna-meridian-human-addon-client-0.1.0-SNAPSHOT.jar')
    localRuntime 'local.meridian:server'
    localRuntime 'org.tomlj:tomlj:1.1.1'
    localRuntime 'org.antlr:antlr4-runtime:4.11.1'
}

test { useJUnit() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// 开发运行固定使用完整装配；游戏内整体验收在 Human-UI 的整合服 smoke 中执行。
apply from: '../../Kizuna-Meridian-Mod-Framework/scripts/full-assembly.gradle'
loom {
    mods {
        'meridian_ui' { sourceSet sourceSets.main }
    }
}

// 内观授权在隔离的完整装配客户端中验收，测试入口不进入发布产物。
sourceSets {
    clientTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        meridian_ui_inner_vision_test { sourceSet sourceSets.clientTest }
    }
    runs {
        innerVisionTest {
            client()
            source sourceSets.clientTest
            runDir "build/inner-vision-test"
            programArgs "--quickPlaySingleplayer", "inner-vision-test", "--width", "1280", "--height", "960"
        }
    }
}
tasks.register("prepareInnerVisionWorld", Copy) {
    from "../../Kizuna-Meridian-Progression-Addon/fabric/build/gametest/world"
    into layout.buildDirectory.dir("inner-vision-test/saves/inner-vision-test")
    exclude "session.lock"
}
tasks.named("runInnerVisionTest") {
    dependsOn tasks.named("prepareInnerVisionWorld")
    def report = layout.buildDirectory.file("inner-vision-results.txt")
    doFirst {
        report.get().asFile.text = "success=false\n"
    }
    doLast {
        if (!report.get().asFile.text.startsWith("success=true")) {
            throw new GradleException("内观客户端验收失败：${report.get().asFile}")
        }
    }
}

plugins {
    id 'net.fabricmc.fabric-loom'
}

description = '通用身体模型、分层选择与状态展示。'

dependencies {
    // 经脉消息与窗口 API 都是必需编译依赖，运行时由宿主提供对应框架。
    implementation 'local.meridian:client'
    // 26.x 不混淆：直接用官方名编译，没有映射，模组依赖也不经重映射。
    minecraft libs.minecraft
    implementation libs.fabric.loader
    implementation libs.fabric.api
    implementation libs.owo
    // 组合进来的 Loom 模组编译直接取其普通 JAR（上游随本仓先行构建），不把框架内嵌进 UI 附属；
    // 开发运行由完整装配按替换坐标装入，这里不再声明第二份。
    compileOnly 'dev.kizuna.inventoryui:kizuna-inventory-ui-framework'
    // 预览直接使用必装动画模组的公开 API。
    compileOnly 'dev.kizuna:kizuna-players-animation'
    // 身体界面的 meridian:* 通道只在 Framework 的 Fabric 模组 MeridianChannels 定义一份，界面直接取用。
    compileOnly 'dev.kizuna.meridian:fabric'
    compileOnly 'dev.kizuna.meridian.progression:client'
    compileOnly 'dev.kizuna.meridian.combat:fabric'
    implementation 'dev.kizuna.meridian.combat:core'
    implementation 'dev.kizuna.meridian.progression:shared'
    testImplementation libs.junit4
    // 单元测试直接使用 Inventory UI 类型，测试类路径单独补上同一份 JAR。
    testImplementation 'dev.kizuna.inventoryui:kizuna-inventory-ui-framework'
    // Loom 开发运行不展开宿主 JAR 的嵌套资源模组，显式装配必需人体展示包；Human 在本仓之上，只在运行时按清单读文件。
    localRuntime files(kizunaWorkspace.artifact('human', 'client', false))
    localRuntime 'local.meridian:server'
    localRuntime libs.tomlj
    localRuntime libs.antlr.runtime
}

test { useJUnit() }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

// 开发运行固定使用完整装配；游戏内整体验收在 Human-UI 的整合服 smoke 中执行。
apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')
loom {
    mods {
        'meridian_ui' { sourceSet sourceSets.main }
    }
}

// 内观授权在隔离的完整装配客户端中验收，测试入口不进入发布产物。
sourceSets {
    clientTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        meridian_ui_inner_vision_test { sourceSet sourceSets.clientTest }
    }
    runs {
        innerVisionTest {
            client()
            source sourceSets.clientTest
            runDir "build/inner-vision-test"
            programArgs "--quickPlaySingleplayer", "inner-vision-test", "--width", "1280", "--height", "960"
        }
    }
}
tasks.register("prepareInnerVisionWorld", Copy) {
    from new File(kizunaWorkspace.directory('progression'), 'fabric/build/gametest/world')
    into layout.buildDirectory.dir("inner-vision-test/saves/inner-vision-test")
    exclude "session.lock"
}
tasks.named("runInnerVisionTest") {
    dependsOn tasks.named("prepareInnerVisionWorld")
    def report = layout.buildDirectory.file("inner-vision-results.txt")
    doFirst {
        report.get().asFile.text = "success=false\n"
    }
    doLast {
        if (!report.get().asFile.text.startsWith("success=true")) {
            throw new GradleException("内观客户端验收失败：${report.get().asFile}")
        }
    }
}

// 功法配置验收使用真实完整装配、独立存档和测试输入，不进入发行 JAR。
sourceSets {
    combatTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
dependencies {
    combatTestImplementation 'dev.kizuna.meridian.technique:fabric'
    combatTestImplementation 'dev.kizuna.meridian.technique:server'
}
loom {
    mods {
        meridian_ui_combat_test { sourceSet sourceSets.combatTest }
    }
    runs {
        combatSlotTest {
            client()
            source sourceSets.combatTest
            runDir 'build/combat-slot-test'
            programArgs '--quickPlaySingleplayer', 'combat-slot-test', '--width', '1280', '--height', '960'
        }
    }
}
tasks.register('prepareCombatSlotWorld', Copy) {
    from new File(kizunaWorkspace.directory('progression'), 'fabric/build/gametest/world')
    into layout.buildDirectory.dir('combat-slot-test/saves/combat-slot-test')
    exclude 'session.lock'
}
tasks.named('runCombatSlotTest') {
    dependsOn tasks.named('prepareCombatSlotWorld')
    def report = layout.buildDirectory.file('combat-slot-results.txt')
    doFirst {
        report.get().asFile.text = 'success=false\n'
        def options = layout.buildDirectory.file('combat-slot-test/options.txt').get().asFile
        options.parentFile.mkdirs()
        options.text = 'onboardAccessibility:false\nlang:zh_cn\nguiScale:2\n'
    }
    doLast {
        if (!report.get().asFile.text.startsWith('success=true')) {
            throw new GradleException("功法配置客户端验收失败：${report.get().asFile}")
        }
    }
}
